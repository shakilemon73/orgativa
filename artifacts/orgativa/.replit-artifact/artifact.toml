kind = "web"
previewPath = "/"
title = "Orgativa"
version = "1.0.0"
id = "artifacts/orgativa"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23810

[services.development]
run = "pnpm --filter @workspace/orgativa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/orgativa", "run", "build" ]
publicDir = "artifacts/orgativa/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23810"
BASE_PATH = "/"
