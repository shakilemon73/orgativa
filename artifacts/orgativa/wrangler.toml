# Cloudflare Pages — Orgativa Frontend
name = "orgativa"
pages_build_output_dir = "dist/public"
compatibility_date = "2024-09-23"

# Build command (run from this directory):
#   pnpm run build
#
# Environment variables are set in the Cloudflare Pages dashboard:
#   VITE_SUPABASE_URL  = https://xxxx.supabase.co
#   VITE_SUPABASE_ANON_KEY = eyJ...
#
# Note: VITE_* vars must be set as "Build environment variables" (not secrets)
# so Vite can inline them at build time.
