name = "orgativa"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Serve the React frontend as static assets.
# run_worker_first tells Cloudflare to ONLY invoke the Worker for /api/* paths.
# All other paths (/, /admin, /admin/login, /cart, etc.) go directly to Assets CDN.
# When no matching file exists, not_found_handling = "single-page-application" serves index.html.
[assets]
directory = "../../artifacts/orgativa/dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
# Non-secret env vars go here.
# Secrets: wrangler secret put SECRET_NAME

[dev]
port = 8787
local_protocol = "http"
